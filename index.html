Indulgent or sugary foods consumed around midday (12:30–13:00) are metabolically tolerable PROVIDED:
A clean 7+ hour gap follows before dinner.
Dinner is protein-forward and free of compounding sweet or high-carb items. This is the operational rule governing planned indulgences.
Sweet Streak Counter

Protein Pre-Loading ("Protein Shield")
Whey isolate + Greek yogurt taken ~60–90 min before a high-glycemic meal is the validated upstream intervention when an indulgent lunch is planned.
36–48 Hour Delayed Weight Response
Weight drops from high-activity days consistently appear 36–48 hours later. Do not interpret the day-after weight as the signal — look two days out.
Refeed Effect
High food volume days following depleted glycogen stores (e.g., post-training buffet) can produce weight drops rather than gains. This is consistent across the dataset.

Cashews function as a behavioral gateway to snacking cascades, not a direct metabolic trigger.
